<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EducationRev</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f8fbff 0%, #eef5fb 100%);
      color: #111827;
    }
    main {
      width: min(560px, calc(100vw - 48px));
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.10);
      padding: 34px;
      text-align: center;
    }
    img {
      width: 74px;
      height: 74px;
      object-fit: contain;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0;
    }
    p {
      margin: 0 auto;
      max-width: 440px;
      color: #4b5563;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 600;
    }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 22px auto 0;
      border: 4px solid #dbeafe;
      border-top-color: #4f46e5;
      border-radius: 999px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="./build/icon-1024.png" alt="">
    <h1>Opening EducationRev</h1>
    <p>Loading the EducationRev sign-in workspace.</p>
    <div class="spinner" aria-label="Loading"></div>
  </main>
</body>
</html>
